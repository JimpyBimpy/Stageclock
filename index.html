<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Stage Clock — fullscreen time display, countdown timer, and agenda import for stage presentations." />
  <title>Stage Clock</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- SheetJS for Excel/CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- ===== Stage display (audience-facing) ===== -->
  <main id="stage" class="stage">

    <!-- Current Time Mode -->
    <section id="mode-time" class="display-mode" data-mode="time" hidden>
      <div id="clock-time" class="clock-time">--:--:--</div>
      <div id="clock-date" class="clock-date">—</div>
    </section>

    <!-- Countdown Timer Mode -->
    <section id="mode-countdown" class="display-mode" data-mode="countdown" hidden>
      <div class="countdown-label" id="countdown-status">Ready</div>
      <div id="countdown-display" class="countdown-display">00:00</div>
      <div id="up-next" class="up-next" hidden>
        <div class="up-next-label">Up Next</div>
        <div class="up-next-content">
          <span class="up-next-title" id="up-next-title">—</span>
          <span class="up-next-speaker" id="up-next-speaker"></span>
          <span class="up-next-time" id="up-next-time"></span>
        </div>
      </div>
    </section>

    <!-- Agenda View Mode -->
    <section id="mode-agenda" class="display-mode" data-mode="agenda" hidden>
      <h2 class="agenda-heading">Agenda</h2>
      <div id="agenda-list" class="agenda-list"></div>
    </section>
  </main>

  <!-- ===== Settings / control panel ===== -->
  <aside id="settings-panel" class="settings-panel" hidden>
    <header class="settings-header">
      <h1>Stage Clock</h1>
      <button id="close-settings" class="icon-btn" title="Close settings (Esc)">✕</button>
    </header>

    <nav class="mode-switch" aria-label="Display mode">
      <button data-modebtn="time" class="mode-btn">Clock</button>
      <button data-modebtn="countdown" class="mode-btn">Countdown</button>
      <button data-modebtn="agenda" class="mode-btn">Agenda</button>
    </nav>

    <!-- Timer controls -->
    <section class="settings-section">
      <h2>Timer</h2>
      <div class="timer-inputs">
        <label>Min <input type="number" id="input-minutes" min="0" max="999" value="5"></label>
        <label>Sec <input type="number" id="input-seconds" min="0" max="59" value="0"></label>
      </div>
      <div class="timer-buttons">
        <button id="btn-start">Start</button>
        <button id="btn-pause">Pause</button>
        <button id="btn-reset">Reset</button>
        <button id="btn-stop">Stop</button>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="auto-advance" checked> Auto-advance to next item
      </label>
    </section>

    <!-- Agenda import -->
    <section class="settings-section">
      <h2>Agenda</h2>
      <input type="file" id="agenda-file" accept=".xlsx,.xls,.csv" />
      <button id="btn-load-sample">Load sample agenda</button>
      <button id="btn-clear-agenda">Clear agenda</button>
      <p class="hint">Excel/CSV columns: Time, Title, Speaker, Duration (min).</p>
      <div id="agenda-summary" class="agenda-summary"></div>
    </section>

    <!-- Appearance -->
    <section class="settings-section">
      <h2>Appearance</h2>
      <div class="color-row">
        <label>Text <input type="color" id="color-text" value="#ffffff"></label>
        <label>Background <input type="color" id="color-bg" value="#000000"></label>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="show-up-next" checked> Show "Up Next" on countdown
      </label>
      <button id="btn-fullscreen">Toggle Fullscreen</button>
    </section>

    <!-- Presenter tools -->
    <section class="settings-section">
      <h2>Presenter</h2>
      <button id="btn-presenter">Open presenter overlay</button>
      <p class="hint">Shortcuts: Space = start/pause, R = reset, F = fullscreen, 1/2/3 = modes, ←/→ = navigate agenda.</p>
    </section>
  </aside>

  <!-- ===== Presenter overlay ===== -->
  <div id="presenter-overlay" class="presenter-overlay" hidden>
    <div class="presenter-content">
      <div class="presenter-current">
        <div class="presenter-label">Current</div>
        <div id="presenter-current-title" class="presenter-title">—</div>
        <div id="presenter-current-speaker" class="presenter-speaker"></div>
        <div id="presenter-current-time" class="presenter-time"></div>
      </div>
      <div class="presenter-timer">
        <div class="presenter-label">Countdown</div>
        <div id="presenter-countdown" class="presenter-countdown">00:00</div>
        <div id="presenter-status" class="presenter-status">Ready</div>
      </div>
      <div class="presenter-next">
        <div class="presenter-label">Next</div>
        <div id="presenter-next-title" class="presenter-title">—</div>
        <div id="presenter-next-speaker" class="presenter-speaker"></div>
        <div id="presenter-next-time" class="presenter-time"></div>
      </div>
    </div>
    <button id="close-presenter" class="icon-btn presenter-close">✕</button>
  </div>

  <!-- Floating control button to open settings -->
  <button id="open-settings" class="open-settings" title="Settings (S)">⚙</button>
</body>
</html>
